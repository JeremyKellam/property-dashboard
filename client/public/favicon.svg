  <rect x="60" y="52" width="16" height="12" rx="2" fill="#1e40af"/>
  <rect x="24" y="68" width="16" height="12" rx="2" fill="#1e40af"/>
  <rect x="60" y="68" width="16" height="12" rx="2" fill="#1e40af"/>
  <!-- Door -->
  <rect x="42" y="62" width="16" height="25" rx="2" fill="#1e40af"/>
</svg>
